apiVersion: v1
kind: Namespace
metadata:
  name: uk-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uk-frontend
  namespace: uk-frontend
  labels:
    app: uk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uk-frontend
  template:
    metadata:
      labels:
        app: uk-frontend
    spec:
      containers:
        - name: uk-frontend
          image: 701372699131.dkr.ecr.eu-central-1.amazonaws.com/qatar-front-end:567b8122caf9178e42678980da9221a7a527b001
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: STRAPI_API_URL
              value: https://cms.globalwingstop.com
            - name: NEXT_PUBLIC_STRAPI_PUBLIC_URL
              value: https://cms.globalwingstop.com
            - name: NEXT_PUBLIC_DEPLOY_ENV
              value: uat-uk
            - name: DEV_FALLBACK_MARKET_DOMAIN
              value: wingstop.co.uk
            - name: MARKET_HOST_MAP
              value: '{"eks-uk-cms.wingstop.qa":"wingstop.co.uk"}'
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: strapi-api-token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: uk-frontend-svc
  namespace: uk-frontend
spec:
  selector:
    app: uk-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uk-frontend-ingress
  namespace: uk-frontend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  rules:
    - host: eks-uk-cms.wingstop.qa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uk-frontend-svc
                port:
                  number: 3000
