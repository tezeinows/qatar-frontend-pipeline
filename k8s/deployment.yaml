apiVersion: apps/v1
kind: Deployment
metadata:
  name: qatar-frontend
  namespace: qatar-frontend
  labels:
    app: qatar-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qatar-frontend
  template:
    metadata:
      labels:
        app: qatar-frontend
    spec:
      containers:
        - name: qatar-frontend
          image: PLACEHOLDER_ECR_IMAGE
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: STRAPI_API_URL
              value: https://cms.globalwingstop.com
            - name: NEXT_PUBLIC_STRAPI_PUBLIC_URL
              value: https://cms.globalwingstop.com
            - name: NEXT_PUBLIC_DEPLOY_ENV
              value: uat-qa
            - name: DEV_FALLBACK_MARKET_DOMAIN
              value: wingstop.qa
            - name: MARKET_HOST_MAP
              value: '{"k8s-qatarfro-qatarfro-76125bb57a-1764750168.eu-central-1.elb.amazonaws.com":"wingstop.qa"}'
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qatar-frontend-secrets
                  key: strapi-api-token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: qatar-frontend-svc
  namespace: qatar-frontend
spec:
  selector:
    app: qatar-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qatar-frontend-ingress
  namespace: qatar-frontend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  rules:
    - host: eks-uat-cms.wingstop.qa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qatar-frontend-svc
                port:
                  number: 3000
