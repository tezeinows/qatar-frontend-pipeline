apiVersion: apps/v1
kind: Deployment
metadata:
  name: qatar-frontend
  labels:
    app: qatar-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qatar-frontend
  template:
    metadata:
      labels:
        app: qatar-frontend
    spec:
      containers:
        - name: qatar-frontend
          image: PLACEHOLDER_ECR_IMAGE
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_STRAPI_URL
              value: https://cms.globalwingstop.com
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qatar-frontend-secrets
                  key: strapi-api-token
            - name: REVALIDATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: qatar-frontend-secrets
                  key: revalidate-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/revalidate
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: qatar-frontend
spec:
  selector:
    app: qatar-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
