name: Build and Deploy to EKS

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: qatar-front-end
  EKS_CLUSTER: qatar-cluster-frankfurt
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Checkout global-wingstop-web
        uses: actions/checkout@v4
        with:
          repository: wingstop-inc/global-wingstop-web
          token: ${{ secrets.GH_PAT }}
          path: global-wingstop-web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::701372699131:role/github-actions-qatar-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --file global-wingstop-web/apps/web/Dockerfile \
            --context global-wingstop-web \
            --platform linux/amd64 \
            --build-arg STRAPI_API_URL=https://cms.globalwingstop.com \
            --build-arg NEXT_PUBLIC_STRAPI_PUBLIC_URL=https://cms.globalwingstop.com \
            --build-arg NEXT_PUBLIC_DEPLOY_ENV=uat-qa \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i "s|PLACEHOLDER_ECR_IMAGE|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -n qatar-frontend
          kubectl rollout status deployment/qatar-frontend -n qatar-frontend --timeout=300s
