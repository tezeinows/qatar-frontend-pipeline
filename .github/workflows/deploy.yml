name: Build and Deploy to EKS

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: qatar-front-end
  EKS_CLUSTER: qatar-cluster-frankfurt
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Checkout global-wingstop-web
        uses: actions/checkout@v4
        with:
          repository: wingstop-inc/global-wingstop-web
          token: ${{ secrets.GH_PAT }}
          path: global-wingstop-web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::701372699131:role/github-actions-qatar-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --file global-wingstop-web/apps/web/Dockerfile \
            --platform linux/amd64 \
            --build-arg STRAPI_API_URL=https://cms.globalwingstop.com \
            --build-arg NEXT_PUBLIC_STRAPI_PUBLIC_URL=https://cms.globalwingstop.com \
            --build-arg NEXT_PUBLIC_DEPLOY_ENV=uat-qa \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            global-wingstop-web
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy all markets to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          for manifest in k8s/deployment*.yaml; do
            echo "--- Deploying $manifest ---"
            sed -i "s|PLACEHOLDER_ECR_IMAGE|$FULL_IMAGE|g" "$manifest"
            kubectl apply -f "$manifest"
          done

          echo "--- Waiting for rollouts ---"
          kubectl rollout status deployment/qatar-frontend -n qatar-frontend --timeout=300s
          kubectl rollout status deployment/uk-frontend -n uk-frontend --timeout=300s

      - name: Commit deployed image tag back to repo
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment*.yaml
          git commit -m "chore: update deployed image to $IMAGE_TAG [skip ci]"
          git push origin main
